<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HRMS Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">
    <img
        src="images/hrms-logo.png"
        alt="HRMS Logo"
        class="sidebar-logo"
    />
</div>

            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item active"><span>📊</span>Dashboard</a>
                <a href="employee.html" class="nav-item"><span>👥</span>Employees</a>
                <a href="departments.html" class="nav-item"><span>🏢</span>Departments</a>
                <a href="projects.html" class="nav-item"><span>📁</span>Projects</a>
                <a href="attendance.html" class="nav-item"><span>📅</span>Attendance</a>
                <a href="leave.html" class="nav-item"><span>🌴</span>Leave Records</a>
                <a href="payroll.html" class="nav-item"><span>💰</span>Payroll</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <h1>Dashboard</h1>
                <p>Overview of your Human Resource Management System</p>
            </header>

            <section class="stats-grid">
                <div class="stat-card">
                    <h3>Total Employees</h3>
                    <p id="totalEmployees">0</p>
                </div>
                <div class="stat-card">
                    <h3>Total Departments</h3>
                    <p id="totalDepartments">0</p>
                </div>
                <div class="stat-card">
                    <h3>Total Projects</h3>
                    <p id="totalProjects">0</p>
                </div>
                <div class="stat-card">
                    <h3>Employees On Leave</h3>
                    <p id="employeesOnLeave">0</p>
                </div>
            </section>
        </main>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
