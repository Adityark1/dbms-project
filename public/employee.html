<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HRMS - Employee Management</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">
    <img
        src="images/hrms-logo.png"
        alt="HRMS Logo"
        class="sidebar-logo"
    />
</div>

            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item"><span>📊</span>Dashboard</a>
                <a href="employee.html" class="nav-item active"><span>👥</span>Employees</a>
                <a href="departments.html" class="nav-item"><span>🏢</span>Departments</a>
                <a href="projects.html" class="nav-item"><span>📁</span>Projects</a>
                <a href="attendance.html" class="nav-item"><span>📅</span>Attendance</a>
                <a href="leave.html" class="nav-item"><span>🌴</span>Leave Records</a>
                <a href="payroll.html" class="nav-item"><span>💰</span>Payroll</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <h1>Employee Management</h1>
                <p>Manage your organization's workforce</p>
            </header>

            <section class="toolbar">
                <input type="text" id="searchInput" placeholder="Search by name, email, or employee ID..." />
            </section>

            <section class="card">
                <h2>Add Employee</h2>
                <form id="employeeForm">
                    <input type="text" id="name" placeholder="Full Name" required />

                    <select id="gender">
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                        
                     <input
                      type="text"
                      id="date_of_birth"
                      placeholder="Date of Birth"
                      onfocus="this.type='date'"
                      onblur="if(!this.value)this.type='text'"
                                                                />

                    <input type="email" id="email" placeholder="Email" />
                    <input type="text" id="phone_no" placeholder="Phone Number" />
                    <input
                      type="text"
                      id="hire_date"
                      placeholder="Hire Date"
                      onfocus="this.type='date'"
                      onblur="if(!this.value)this.type='text'"
                                                                />
                    <input type="number" id="salary" placeholder="Salary" step="0.01" />
                    <input type="number" id="department_id" placeholder="Department ID" />

                    <button type="submit" id="submitBtn">Add Employee</button>
                </form>
            </section>

            <section class="card">
                <h2>Employee List</h2>
                <div class="table-wrapper">
                    <table id="employeeTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Gender</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Salary</th>
                                <th>Department</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="js/employee.js"></script>
</body>
</html>
