<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HRMS - Payroll</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">
    <img
        src="images/hrms-logo.png"
        alt="HRMS Logo"
        class="sidebar-logo"
    />
</div>

            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <span>📊</span> Dashboard
                </a>
                <a href="employee.html" class="nav-item">
                    <span>👥</span> Employees
                </a>
                <a href="departments.html" class="nav-item">
                    <span>🏢</span> Departments
                </a>
                <a href="projects.html" class="nav-item">
                    <span>📁</span> Projects
                </a>
                <a href="attendance.html" class="nav-item">
                    <span>📅</span> Attendance
                </a>
                <a href="leave.html" class="nav-item">
                    <span>🌴</span> Leave Records
                </a>
                <a href="payroll.html" class="nav-item active">
                    <span>💰</span> Payroll
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <h1>Payroll</h1>
                <p>Manage salaries, bonuses, deductions, and net pay</p>
            </header>

            <!-- Search -->
            <section class="toolbar">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search payroll records..."
                />
            </section>

            <!-- Add Payroll Form -->
            <section class="card">
                <h2>Add Payroll Record</h2>

                <form id="payrollForm">
                    <input
                        type="number"
                        id="employee_id"
                        placeholder="Employee ID"
                        required
                    />

                    <input
                        type="number"
                        id="basic_salary"
                        placeholder="Basic Salary"
                        step="0.01"
                        required
                    />

                    <input
                        type="number"
                        id="bonus"
                        placeholder="Bonus"
                        step="0.01"
                    />

                    <input
                        type="number"
                        id="deductions"
                        placeholder="Deductions"
                        step="0.01"
                    />

                    <input
                        type="number"
                        id="loss_of_pay"
                        placeholder="Loss of Pay"
                        step="0.01"
                    />

                    <input
                        type="date"
                        id="payment_date"
                    />

                    <button type="submit" id="submitBtn">
                        Add Payroll Record
                    </button>
                </form>
            </section>

            <!-- Payroll Table -->
            <section class="card">
                <h2>Payroll Records</h2>

                <div class="table-wrapper">
                    <table id="payrollTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Employee</th>
                                <th>Basic Salary</th>
                                <th>Bonus</th>
                                <th>Deductions</th>
                                <th>Loss of Pay</th>
                                <th>Net Salary</th>
                                <th>Payment Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Filled by payroll.js -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="js/payroll.js"></script>
</body>
</html>
